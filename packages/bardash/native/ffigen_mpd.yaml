name: MpdBindings
description: Dart FFI bindings for libmpdclient
output: '../lib/src/native/ffigen_mpd.dart'
headers:
  entry-points:
    - '/usr/include/mpd/client.h'
  include-directives:
    - '/usr/include/mpd/**'
compiler-opts:
  - '-I/usr/include'
  - '-I/usr/lib/clang/22/include'
  - '-I/usr/include/x86_64-linux-gnu'
preamble: |
  // Auto-generated by ffigen. Do not edit manually.
sort: true
comments: false
structs:
  dependency-only: opaque
unions:
  dependency-only: opaque

# Silence enum size warnings — the generated code matches GCC/Clang defaults
silence-enum-warning: true
