name: IconShimBindings
description: Dart FFI bindings for bardash icon_shim (GTK + librsvg)
output: '../lib/src/native/ffigen_icon.dart'
headers:
  entry-points:
    - 'icon_shim.h'
  include-directives:
    - 'icon_shim.h'
compiler-opts:
  - '-I.'
preamble: |
  // Auto-generated by ffigen from native/icon_shim.h. Do not edit.
  //
  // Regenerate:
  //   dart run ffigen --config native/ffigen_icon.yaml
sort: true
comments: true
silence-enum-warning: true
