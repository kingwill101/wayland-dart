name: GLES3
description: |

  Regenerate bindings with `dart run ffigen`.
output: "../lib/src/bindings/gles3_binding.dart"
headers:
  entry-points:
    - /usr/include/GLES3/gl3.h
  include-directives:
    - /usr/include/GLES3/gl3.h

comments:
  style: any
  length: full

use-supported-typedefs: true

llvm-path:
  - "/usr/lib/llvm"
  - "/usr/lib64/libclang.so"

compiler-opts:
  - "-I/usr/lib/clang/18/include"
  - "-I/usr/local/include"
  - "-I/usr/include"
