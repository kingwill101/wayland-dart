name: GLES2
description: |

  Regenerate bindings with `dart run ffigen`.
output: "../lib/src/bindings/gles2_binding.dart"
headers:
  entry-points:
    - /usr/include/GLES2/gl2.h
  include-directives:
    - /usr/include/GLES2/gl2.h

comments:
  style: any
  length: full

use-supported-typedefs: true

llvm-path:
  - "/usr/lib/llvm"
  - "/usr/lib64/libclang.so"

compiler-opts:
  - "-I/usr/lib/clang/18/include"
  - "-I/usr/local/include"
  - "-I/usr/include"
